name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go test -race ./...
      - run: mkdir -p ../dist
      - run: go build -buildmode=c-shared -o ../dist/provider-rate-limiter-${{ matrix.os }} .
      - uses: actions/upload-artifact@v4
        with:
          name: provider-rate-limiter-${{ matrix.os }}
          path: dist/provider-rate-limiter-${{ matrix.os }}
